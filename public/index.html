<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#040806">
  <title>RUAHSIS :: Student Information System</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14' font-family='monospace' fill='%236cff9e'>R</text></svg>">
  <link rel="stylesheet" href="/css/terminal.css">
</head>

<body class="scan">

  <!-- ============================ BOOT ============================ -->
  <div id="boot">
    <div>
      <pre id="bootart"></pre>
      <pre class="bootlog" id="bootlog"></pre>
    </div>
  </div>

  <!-- ============================ LOGIN ============================ -->
  <div id="login" class="hidden">
    <div class="login-wrap">
      <pre id="loginart"></pre>
      <pre class="login-tag">      S T U D E N T   I N F O R M A T I O N   S Y S T E M</pre>
      <div id="loginbox"></div>
      <pre class="dim" style="margin-top:14px" id="logindemo"></pre>
    </div>
  </div>

  <!-- ============================ APP ============================ -->
  <div id="app" class="hidden">
    <header id="hdr"></header>
    <div id="body">
      <nav id="side"></nav>
      <main id="main"></main>
    </div>
    <footer id="status"></footer>
  </div>

  <div id="backdrop"></div>
  <div id="modal" class="hidden"></div>
  <div id="toast"></div>

  <script src="/js/util.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/students.js"></script>
  <script src="/js/views/staff.js"></script>
  <script src="/js/views/scheduling.js"></script>
  <script src="/js/views/grades.js"></script>
  <script src="/js/views/attendance.js"></script>
  <script src="/js/views/discipline.js"></script>
  <script src="/js/views/fees.js"></script>
  <script src="/js/views/reports.js"></script>
  <script src="/js/views/setup.js"></script>
  <script src="/js/views/messages.js"></script>
  <script src="/js/app.js"></script>
</body>

</html>
